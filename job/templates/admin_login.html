<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Login | JobConnect</title>
    <meta name="description" content="Admin login portal for JobConnect administrators." />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --primary: #4f46e5;
            --accent: #06b6d4;
            --dark: #0f172a;
            --card-bg: #1e293b;
            --muted: #94a3b8;
        }

        * {
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--dark);
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* ── Navbar ── */
        .navbar {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.07);
        }

        .navbar-brand span {
            color: var(--accent);
        }

        .nav-link {
            color: #cbd5e1 !important;
            font-weight: 500;
            transition: color .2s;
        }

        .nav-link:hover {
            color: var(--accent) !important;
        }

        /* ── Auth wrapper ── */
        .auth-wrapper {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 100px 16px 60px;
            background: linear-gradient(135deg, #1e1b4b 0%, #0f172a 60%, #164e63 100%);
        }

        .auth-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 48px 40px;
            width: 100%;
            max-width: 440px;
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(90deg, #f59e0b, #ef4444);
        }

        .auth-icon {
            width: 72px;
            height: 72px;
            border-radius: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            margin: 0 auto 24px;
            background: rgba(245, 158, 11, 0.15);
            color: #fcd34d;
        }

        .form-control-dark {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid rgba(255, 255, 255, 0.1) !important;
            color: #e2e8f0 !important;
            border-radius: 10px;
            padding: 12px 16px;
        }

        .form-control-dark::placeholder {
            color: var(--muted);
        }

        .form-control-dark:focus {
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.25) !important;
            border-color: #f59e0b !important;
        }

        .btn-auth {
            background: linear-gradient(135deg, #f59e0b, #ef4444);
            border: none;
            color: #fff;
            border-radius: 10px;
            font-weight: 600;
            padding: 13px;
            font-size: 1rem;
            transition: opacity .2s;
        }

        .btn-auth:hover {
            opacity: .88;
            color: #fff;
        }

        .input-icon-wrap {
            position: relative;
        }

        .input-icon-wrap .bi {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted);
            font-size: 1rem;
        }

        .input-icon-wrap input {
            padding-left: 40px !important;
        }

        footer {
            background: #060c1a;
            border-top: 1px solid rgba(255, 255, 255, 0.06);
            color: var(--muted);
            font-size: .85rem;
            text-align: center;
            padding: 18px;
        }
    </style>
</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top">
        <div class="container">
            <a class="navbar-brand fw-bold fs-4 text-white" href="/">Job<span>Connect</span></a>
            <div class="d-flex gap-2">
                <a href="/" class="btn btn-outline-light btn-sm rounded-pill px-3">
                    <i class="bi bi-house-door me-1"></i>Home
                </a>
            </div>
        </div>
    </nav>

    <!-- Auth Card -->
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-icon mx-auto">
                <i class="bi bi-shield-lock-fill"></i>
            </div>
            <h1 class="text-white fw-800 text-center mb-1" style="font-size:1.6rem;">Admin Portal</h1>
            <p class="text-center mb-4" style="color:var(--muted);font-size:.9rem;">
                Restricted access — authorized administrators only
            </p>

            <!-- Error Alert -->
            {% if error and error != "not set" %}
            <div class="alert d-flex align-items-center gap-2 mb-4"
                style="background:rgba(239,68,68,0.12);border:1px solid rgba(239,68,68,0.3);border-radius:10px;color:#fca5a5;">
                <i class="bi bi-exclamation-triangle-fill"></i>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            {% if error == "not set" %}
            <div class="alert d-flex align-items-center gap-2 mb-4"
                style="background:rgba(16,185,129,0.12);border:1px solid rgba(16,185,129,0.3);border-radius:10px;color:#6ee7b7;">
                <i class="bi bi-check-circle-fill"></i>
                <span>Login successful! Redirecting…</span>
            </div>
            {% endif %}

            <form action="/adminlogin/" method="post" id="adminLoginForm">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="adminUsername" class="form-label small text-secondary">Username</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-person"></i>
                        <input type="text" class="form-control form-control-dark" id="adminUsername" name="username"
                            placeholder="Admin username" required />
                    </div>
                </div>
                <div class="mb-4">
                    <label for="adminPassword" class="form-label small text-secondary">Password</label>
                    <div class="input-icon-wrap">
                        <i class="bi bi-lock"></i>
                        <input type="password" class="form-control form-control-dark" id="adminPassword" name="password"
                            placeholder="••••••••" required />
                    </div>
                </div>
                <button type="submit" class="btn btn-auth w-100" id="adminLoginBtn">
                    <i class="bi bi-shield-check me-2"></i>Login as Admin
                </button>
            </form>

            <hr class="my-4" style="border-color:rgba(255,255,255,0.08);" />
            <p class="text-center small mb-0" style="color:var(--muted);">
                <a href="/" style="color:#fcd34d;"><i class="bi bi-arrow-left me-1"></i>Back to Home</a>
            </p>
        </div>
    </div>

    <footer>© 2026 JobConnect. All rights reserved.</footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>

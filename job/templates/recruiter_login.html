{% extends 'base.html' %}

{% block title %}Recruiter Login | JobConnect{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card bg-dark border-secondary p-4 shadow-lg rounded-4">
                <div class="text-center mb-4">
                    <div class="bg-success bg-opacity-10 text-success rounded-circle d-inline-flex align-items-center justify-content-center mb-3"
                        style="width: 64px; height: 64px;">
                        <i class="bi bi-building fs-2"></i>
                    </div>
                    <h3 class="fw-bold">Recruiter Login</h3>
                    <p class="text-secondary small">Manage your job postings and applicants.</p>
                </div>

                {% if error == "not set" %}
                <script>
                    alert('Logged in successfully!');
                    window.location.href = "{% url 'recruiterhome' %}";
                </script>
                {% elif error %}
                <div class="alert alert-danger alert-custom mb-4 py-2 small">
                    <i class="bi bi-exclamation-triangle-fill me-2"></i> {{ error }}
                </div>
                {% endif %}

                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Username (Email)</label>
                        <input type="text" name="username"
                            class="form-control bg-transparent border-secondary text-white py-2"
                            placeholder="Enter company email" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small text-secondary">Password</label>
                        <input type="password" name="password"
                            class="form-control bg-transparent border-secondary text-white py-2" placeholder="••••••••"
                            required>
                    </div>

                    <button type="submit" class="btn btn-success w-100 py-2 mb-3 rounded-3 fw-bold">
                        Login as Recruiter
                    </button>
                </form>

                <div class="text-center small">
                    <span class="text-secondary">New company?</span>
                    <a href="{% url 'recruitersignup' %}" class="text-success fw-600 text-decoration-none ms-1">Register
                        here</a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
